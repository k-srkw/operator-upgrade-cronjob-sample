apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: installplan-approver
  labels:
    app.kubernetes.io/name: installplan-approver
    app.kubernetes.io/part-of: operator-upgrade-approver
rules:
  - apiGroups:
      - operators.coreos.com
    resources:
      - subscriptions
    verbs:
      - get
      - list
  - apiGroups:
      - operators.coreos.com
    resources:
      - installplans
    verbs:
      - get
      - list
      - patch
  # クラスタの OCP バージョンを参照して同じ y-stream の oc クライアントを取得するため
  - apiGroups:
      - config.openshift.io
    resources:
      - clusterversions
    verbs:
      - get
